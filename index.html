<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Крестики-нолики</title>
</head>
<body>
  <div class="main__wrapper">
    <h1 class="main__title">Крестики-Нолики-Ебоболики</h1>
    <div class="move"></div>
    <div class="playtable">
      <div class="playcell" data-index="1"></div>
      <div class="playcell" data-index="2"></div>
      <div class="playcell" data-index="3"></div>
      <div class="playcell" data-index="4"></div>
      <div class="playcell" data-index="5"></div>
      <div class="playcell" data-index="6"></div>
      <div class="playcell" data-index="7"></div>
      <div class="playcell" data-index="8"></div>
      <div class="playcell" data-index="9"></div>
    </div>
    <div class="main__buttons">
      <button class="button_newgame">Новая игра</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
